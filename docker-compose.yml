name: profile-card

services:
  postgres:
    container_name: profile-card-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nestjs-profile
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: profile-card-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: profile-card-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?schema=public
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - nestjs-profile
    command: sh -c "npx prisma migrate deploy --config prisma7.config.ts && node dist/main.js"

volumes:
  postgres_data:

networks:
  nestjs-profile:
    driver: bridge
